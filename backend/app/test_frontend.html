<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlameGuard API Test</title>
    <!-- Load a lightweight markdown renderer via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      body {
        font-family: system-ui;
        background: #0f172a;
        color: #cbd5e1;
        padding: 2rem;
        max-width: 800px;
        margin: auto;
      }
      textarea {
        width: 100%;
        height: 80px;
        margin-bottom: 10px;
        background: #1e293b;
        color: white;
        border: 1px solid #334155;
        padding: 10px;
      }
      button {
        padding: 10px 20px;
        background: #3b82f6;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }
      button:hover {
        background: #2563eb;
      }
      .result-box {
        background: #1e293b;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
        border: 1px solid #334155;
      }
      img {
        max-width: 100%;
        border-radius: 8px;
        border: 1px solid #475569;
        margin: 10px 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 10px 0;
      }
      th,
      td {
        border: 1px solid #475569;
        padding: 8px;
        text-align: left;
      }
      th {
        background: #334155;
      }
    </style>
  </head>
  <body>
    <h2>SI Backend Test Console</h2>
    <textarea
      id="query"
      placeholder="Ask about BASS-II flame geometries or PMMA..."
    ></textarea>
    <button onclick="searchAPI()">Search</button>

    <div id="loading" style="display: none; margin-top: 10px">
      Querying Groq & Pinecone...
    </div>

    <div class="result-box" id="output" style="display: none"></div>

    <script>
      async function searchAPI() {
        const query = document.getElementById("query").value;
        const outputDiv = document.getElementById("output");
        const loadingDiv = document.getElementById("loading");

        outputDiv.style.display = "none";
        loadingDiv.style.display = "block";

        try {
          // Call your local FastAPI server
          const response = await fetch("http://127.0.0.1:8000/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: query, top_k: 5 }),
          });

          const data = await response.json();
          loadingDiv.style.display = "none";
          outputDiv.style.display = "block";

          // Combine the synthesized answer and raw chunks
          let combinedMarkdown = `### AI Synthesis\n\n${data.synthesized_answer}\n\n---\n### Raw Evidence\n\n`;
          data.raw_results.forEach((res, index) => {
            combinedMarkdown += `**Result ${index + 1}:**\n${res.text}\n\n`;
          });

          // Render the markdown (including images and tables) to HTML
          outputDiv.innerHTML = marked.parse(combinedMarkdown);
        } catch (error) {
          loadingDiv.style.display = "none";
          outputDiv.style.display = "block";
          outputDiv.innerHTML = `<p style="color: #ef4444;">Error: Make sure FastAPI is running on port 8000. Details: ${error}</p>`;
        }
      }
    </script>
  </body>
</html>
